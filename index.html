<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IronSim - IRONMAN Maryland Simulator</title>
    
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background-color: #151c2c;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .metric-val {
            font-size: 2.8rem;
            font-weight: bold;
            color: #00ff88;
        }
        .metric-unit {
            font-size: 1rem;
            color: #8a99ad;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }
        #logBox {
            background: #000;
            color: #00ff88;
            font-family: monospace;
            height: 120px;
            overflow-y: auto;
            padding: 10px;
            border-radius: 5px;
            font-size: 0.8rem;
        }
        button, select {
            background: #0066ff;
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover { background: #0052cc; }
        .course-container {
            position: relative;
            width: 100%;
            height: 600px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }
        .hud-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.85);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #00ff88;
            z-index: 1000;
        }
        .view-controls {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            width: 220px;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center; color: #00ff88;">IronSim: IRONMAN Maryland Bike Simulator</h1>
    
    <div class="container">
        <div class="sidebar">
            <div class="card">
                <h3>Bike Telemetry</h3>
                <button onclick="connectBike()">Connect Schwinn IC4</button>
                <div id="bikeStatus" style="margin-top: 10px; font-weight: bold; color: #ffcc00;">Not Connected</div>
                
                <div class="metrics-grid">
                    <div>
                        <div class="metric-unit">POWER</div>
                        <div class="metric-val"><span id="power">0</span> <span class="metric-unit">W</span></div>
                    </div>
                    <div>
                        <div class="metric-unit">CADENCE</div>
                        <div class="metric-val"><span id="cadence">0</span> <span class="metric-unit">RPM</span></div>
                    </div>
                    <div>
                        <div class="metric-unit">SPEED</div>
                        <div class="metric-val"><span id="speed">0.0</span> <span class="metric-unit">MPH</span></div>
                    </div>
                    <div>
                        <div class="metric-unit">DISTANCE</div>
                        <div class="metric-val"><span id="distance">0.0</span> <span class="metric-unit">MI</span></div>
                    </div>
                </div>
            </div>

            <div class="card" style="margin-top: 20px;">
                <h3>System Log</h3>
                <div id="logBox">Awaiting bike connection...</div>
            </div>
        </div>

        <div class="main-view">
            <div class="card course-container">
                <div id="map"></div>
                
                <div class="hud-overlay">
                    <h2 style="margin: 0; font-size: 1.2rem; color: #00ff88;">IRONMAN Maryland (Cambridge, MD)</h2>
                    <p style="margin: 5px 0 0 0; font-size: 0.9rem;">Course Progress: <span id="courseProgress">0.00</span> / 112.0 Mi</p>
                </div>

                <div class="view-controls">
                    <select id="mapStyleSelect" onchange="changeMapStyle(this.value)">
                        <option value="satellite">🛰️ Esri High-Res Satellite</option>
                        <option value="street">🗺️ OpenStreetMap Standard</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS Library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const ride = { power: 0, cadence: 0, speed: 0, distance: 0, isBluetoothConnected: false };

        function logMsg(msg) {
            const logBox = document.getElementById("logBox");
            if (logBox) {
                logBox.innerHTML += "<div>" + msg + "</div>";
                logBox.scrollTop = logBox.scrollHeight;
            }
        }
    </script>
    <script src="bike.js?v=6"></script>
    <script src="immd.js?v=4"></script>
</body>
</html>
