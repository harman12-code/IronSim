<!DOCTYPE html>
<html>
<head>
    <title>IronSim</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #111827;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .card {
            background: #1f2937;
            border-radius: 20px;
            padding: 20px;
            margin-top: 30px;
        }

        .metric {
            font-size: 28px;
            margin: 15px;
        }
    </style>
</head>

<body>

<h1>IRONSIM</h1>

<p>Virtual Ironman Training Simulator</p>

<div class="card">

<div class="metric">
⚡ Power: -- watts
</div>

<div class="metric">
🚴 Cadence: -- RPM
</div>

<div class="metric">
💨 Speed: -- MPH
</div>

<div class="metric">
📍 Course: Ironman Maryland
</div>

</div>

</body>
</html>
