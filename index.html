<!DOCTYPE html>
<html>
<head>
    <title>IronSim</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        button {
    font-size: 24px;
    padding: 15px 30px;
    border-radius: 15px;
    border: none;
    margin-top: 20px;
}
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #111827;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .card {
            background: #1f2937;
            border-radius: 20px;
            padding: 20px;
            margin-top: 30px;
        }

        .metric {
            font-size: 28px;
            margin: 15px;
        }
    </style>
</head>

<body>

<h1>IRONSIM</h1>

<p>Virtual Ironman Training Simulator</p>

<div class="card">

<div class="metric">
⚡ Power: <span id="power">--</span> watts
</div>

<div class="metric">
🚴 Cadence: <span id="cadence">--</span> RPM
</div>

<div class="metric">
💨 Speed: <span id="speed">--</span> MPH
</div>

<div class="metric">
📍 Distance: <span id="distance">0</span> miles
</div>

<div class="metric">
📍 Course: Ironman Maryland
</div>
<button onclick="startRide()">
Start Ride
</button>

<div class="metric">
⏱️ Time: <span id="time">0:00</span>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
